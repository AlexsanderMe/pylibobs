name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------
  # pylibobs X.Y.Z bundles libobs X.Y.Z; pylibobs-only releases on the same
  # libobs add a fourth number (X.Y.Z.N). A PyPI upload can't be redone, so
  # refuse to build anything unless the tag, both version strings and the
  # OBS pin in fetch_libs.py agree with that scheme.
  # --------------------------------------------------------------------
  check-version:
    name: Check version matches tag and libobs pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare tag, pyproject, __version__ and DEFAULT_OBS_TAG
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: python scripts/check_version.py
        shell: bash

  # --------------------------------------------------------------------
  # Build platform-specific wheels.
  # Each wheel bundles the libobs binaries downloaded by fetch_libs.py,
  # so end users `pip install pylibobs` and it Just Works™ — no OBS
  # install required.
  # --------------------------------------------------------------------
  build-wheels:
    name: Build wheel / ${{ matrix.os }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_os: windows
            target_arch: x86_64
          # Pinned: OBS 33 ships its Linux build for Ubuntu 26.04 only, and the
          # smoke-loading of the bundle needs that image's glibc and sonames.
          - os: ubuntu-26.04
            target_os: linux
            target_arch: x86_64
          # Apple Silicon only — Apple stopped shipping Intel Macs in
          # 2022 and GitHub's macos-13 (Intel) runners have multi-hour
          # queue times. Intel users can still install pylibobs from
          # sdist (which compiles fine on any macOS).
          - os: macos-14
            target_os: macos
            target_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=68" build wheel requests
          if [ "${{ runner.os }}" = "Linux" ]; then
            pip install zstandard
          fi
        shell: bash

      - name: Download bundled libobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_libs.py \
            --platform ${{ matrix.target_os }} \
            --arch ${{ matrix.target_arch }}
        shell: bash

      - name: Verify bundled libs are in place
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          target_os = "${{ matrix.target_os }}"
          base = Path(f"pylibobs/_libs/{target_os}/${{ matrix.target_arch }}")
          if not base.exists():
              sys.exit(f"Missing {base}")

          # The bundle is only useful if these specific artefacts survive the
          # trim. Checking the directory merely *exists* lets an empty or
          # half-extracted bundle ship — which is how a wheel that cannot start
          # libobs at all gets published.
          required = {
              "windows": [
                  "obs.dll",
                  "libobs-d3d11.dll",
                  # NB: d3dcompiler_47.dll is deliberately NOT asserted. libobs
                  # needs it to compile its HLSL .effect files at runtime, but
                  # OBS does not ship it — verified against the 32.1.2 zip, which
                  # contains no d3dcompiler at all. It is a Windows system
                  # component resolved from System32.
                  "obs-ffmpeg-mux.exe",
                  # OBS 33: one core/<module>/ directory per plugin.
                  "core/obs-ffmpeg/obs-ffmpeg.dll",
                  "core/image-source/image-source.dll",
                  "core/obs-transitions/obs-transitions.dll",
                  # win-dshow provides BOTH the camera input and virtualcam_output.
                  "core/win-dshow/win-dshow.dll",
                  # The DirectShow filter the conferencing app loads in-process;
                  # without it the vcam starts but no app can see it.
                  "core/win-dshow/data/obs-virtualcam-module64.dll",
                  "core/win-dshow/data/obs-virtualcam-module32.dll",
                  "data/libobs",
              ],
              "linux": [
                  "libobs.so*",
                  "libobs-opengl.so*",
                  # OBS 33: obs-modules/core/ (was obs-plugins/).
                  "obs-modules/core/obs-ffmpeg.so",
                  "obs-modules/core/image-source.so",
                  "obs-modules/core/obs-transitions.so",
                  # linux-v4l2 registers virtualcam_output on Linux.
                  "obs-modules/core/linux-v4l2.so",
                  "data/libobs",
              ],
              "macos": [
                  # The dmg lays the framework out under Frameworks/, not at the
                  # bundle root.
                  "Frameworks/libobs.dylib",
                  # macOS keeps the shader effects inside the framework bundle
                  # rather than in a data/ tree like Windows and Linux.
                  "Frameworks/libobs.framework/Versions/A/Resources/*.effect",
                  # Plugins are .plugin bundles (checked against the 33.0.0 dmg).
                  "PlugIns/obs-ffmpeg.plugin/Contents/MacOS/obs-ffmpeg",
              ],
          }.get(target_os, [])

          # Glob rather than exact names: Linux ships versioned sonames
          # (libobs.so.0, libobs-opengl.so.30) and which symlinks survive the
          # .deb extraction varies by release.
          missing = [rel for rel in required if not list(base.glob(rel))]
          if missing:
              for rel in missing:
                  print(f"  MISSING: {base / rel}")
              print("--- what IS present ---")
              for entry in sorted(base.rglob("*"))[:60]:
                  print(f"  {entry.relative_to(base)}")
              sys.exit(f"{len(missing)} required artefact(s) absent from {base}")

          files = list(base.rglob("*"))
          total = sum(f.stat().st_size for f in files if f.is_file())
          print(f"Bundled {len(files)} files / {total/1e6:.1f} MB in {base}")
          print(f"Verified {len(required)} required artefacts present.")
          PY
        shell: bash

      - name: Build wheel
        # Use build isolation so build downloads the exact setuptools>=68
        # declared in pyproject.toml's [build-system].requires.
        env:
          # macOS: the wheel must carry the IOSurface helper.
          PYLIBOBS_REQUIRE_NATIVE: "1"
        run: python -m build --wheel

      - name: Verify macOS wheel carries the IOSurface helper
        if: runner.os == 'macOS'
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          for whl in glob.glob("dist/*.whl"):
              if "pylibobs/native/macos_surfaces.dylib" not in zipfile.ZipFile(whl).namelist():
                  sys.exit(f"{whl} lacks pylibobs/native/macos_surfaces.dylib")
          PY
        shell: bash

      # PyPI rejects Linux wheels tagged `linux_*` — they must be `manylinux_*`.
      # Standard auditwheel-repair doesn't help here (it expects a C extension
      # to rewrite; we ship a pure-Python package with bundled .so's).
      # Instead we directly rename the wheel's platform tag using `wheel tags`.
      # The tag must state the real glibc floor: OBS 33's only Linux build is
      # for Ubuntu 26.04, and its libobs.so.30 needs GLIBC_2.43, so pip
      # installs it on glibc 2.43+ systems only. (32.x's hard-coded 2.31
      # understated that bundle's real floor of 2.34.)
      - name: Re-tag Linux wheel as manylinux
        if: runner.os == 'Linux'
        # `wheel tags --remove` deletes the original wheel and writes the
        # retagged one into the same directory. No move dance needed.
        # The glibc floor is read from the bundled binaries rather than
        # hard-coded, so the tag stays truthful when OBS moves its build base.
        run: |
          pip install wheel
          glibc_minor=$(python - <<'PY'
          import re
          from pathlib import Path
          need = 0
          for f in Path("pylibobs/_libs/linux").rglob("*"):
              if f.is_file() and not f.is_symlink():
                  data = f.read_bytes()
                  if data[:4] == b"\x7fELF":
                      need = max([need] + [int(m) for m in re.findall(rb"GLIBC_2\.(\d+)", data)])
          if not need:
              raise SystemExit("no GLIBC_2.x symbol versions found in the bundle")
          print(need)
          PY
          )
          echo "bundled binaries need glibc 2.${glibc_minor}"
          for whl in dist/*-linux_*.whl; do
            python -m wheel tags --platform-tag "manylinux_2_${glibc_minor}_x86_64" --remove "$whl"
          done
          ls -la dist/
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist/*.whl

  # --------------------------------------------------------------------
  # Build a source distribution (sdist) — used as a fallback on platforms
  # we don't ship binary wheels for. Builds from the user's system OBS.
  # --------------------------------------------------------------------
  build-sdist:
    name: Build sdist
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build
        run: pip install build
      - name: Build sdist
        run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # --------------------------------------------------------------------
  # Publish to PyPI via Trusted Publishing (OIDC).
  # Requires the pylibobs project on PyPI to have this repo registered as
  # a trusted publisher. No tokens stored in GitHub secrets.
  # --------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pylibobs
    permissions:
      id-token: write       # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Show what we're publishing
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Trusted Publishing — no password / token needed if configured
          packages-dir: dist/

  # --------------------------------------------------------------------
  # Attach wheels to the GitHub release
  # --------------------------------------------------------------------
  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    # Only after PyPI accepted the upload, so the GitHub release always holds
    # exactly what PyPI serves (v0.1.2's assets were rebuilt after a failed publish).
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release with wheels
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

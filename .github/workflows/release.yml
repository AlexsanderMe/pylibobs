name: Snapshot wheels
run-name: Snapshot ${{ inputs.upstream_sha }} / revision ${{ inputs.build_revision }}

on:
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: Full commit SHA from jonata/pylibobs main
        required: true
        type: string
      build_revision:
        description: Build revision (increase when rebuilding the same source)
        required: true
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: snapshot-wheels
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  prepare:
    if: github.repository == 'AlexsanderMe/pylibobs' && github.ref == 'refs/heads/build/snapshot-wheels'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: recipe
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate upstream commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        run: python recipe/scripts/snapshot_release.py validate-source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jonata/pylibobs
          ref: ${{ steps.source.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Check upstream version contract
        run: python source/scripts/check_version.py
      - name: Plan snapshot and comparison
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.source.outputs.source_sha }}
          BUILD_REVISION: ${{ inputs.build_revision }}
        run: python recipe/scripts/snapshot_release.py plan --source source --plan plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshot-plan
          path: plan.json
          if-no-files-found: error

  build:
    needs: prepare
    name: Wheel / ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows
            arch: x86_64
          - runner: ubuntu-26.04
            platform: linux
            arch: x86_64
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: recipe
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jonata/pylibobs
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: snapshot-plan
          path: plan
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y obs-studio dpkg
      - name: Install build dependencies
        run: python -m pip install 'setuptools>=68' build wheel requests zstandard
      - name: Fetch official OBS runtime
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: python scripts/fetch_libs.py --platform "$TARGET_PLATFORM" --arch "$TARGET_ARCH"
      - name: Validate original upstream source
        working-directory: source
        env:
          PYLIBOBS_REQUIRE_NATIVE: '1'
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest tests/unit -q
          git diff --exit-code
      - name: Apply snapshot version to build checkout
        run: python recipe/scripts/snapshot_release.py stamp --source source --plan plan/plan.json
      - name: Build wheel
        working-directory: source
        env:
          PYLIBOBS_REQUIRE_NATIVE: '1'
        run: python -m build --wheel
      - name: Set Linux compatibility tag from bundled ELF requirements
        if: runner.os == 'Linux'
        run: python recipe/scripts/snapshot_release.py retag-linux --source source
      - name: Verify and smoke-test installed wheel
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: python recipe/scripts/snapshot_release.py verify-wheel --source source --plan plan/plan.json --platform "$TARGET_PLATFORM" --arch "$TARGET_ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.arch }}
          path: source/dist/*.whl
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: recipe
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: snapshot-plan
          path: plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Assemble checksums, provenance, and concise release notes
        run: python recipe/scripts/snapshot_release.py assemble --plan plan/plan.json --dist dist
      - name: Publish all assets through a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python recipe/scripts/snapshot_release.py publish --plan plan/plan.json --dist dist
